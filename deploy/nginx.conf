# /etc/nginx/sites-available/armedias.com
# Static pages are served straight from disk; only /api/ goes to the Node process.
# TLS certificates: run `certbot --nginx -d armedias.com -d www.armedias.com` after first deploy.

server {
    listen 80;
    listen [::]:80;
    server_name armedias.com www.armedias.com;
    return 301 https://armedias.com$request_uri;
}

server {
    # nginx 1.24 syntax for HTTP/2 (the separate `http2 on;` needs 1.25.1+)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.armedias.com;
    ssl_certificate     /etc/letsencrypt/live/armedias.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/armedias.com/privkey.pem;
    return 301 https://armedias.com$request_uri;
}

server {
    # nginx 1.24 syntax for HTTP/2 (the separate `http2 on;` needs 1.25.1+)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name armedias.com;
    ssl_certificate     /etc/letsencrypt/live/armedias.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/armedias.com/privkey.pem;

    # Real visitor IPs behind Cloudflare (needed for login lockouts and analytics)
    include /etc/nginx/snippets/cloudflare-realip.conf;

    root /var/www/armedias/current/dist/client;
    index index.html;

    include /etc/nginx/snippets/armedias-security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml application/rss+xml;

    # Old PHP site -> new URLs (keeps any ranking the old pages earned)
    rewrite ^/home\.php$                            /                                 permanent;
    rewrite ^/index\.php$                           /                                 permanent;
    rewrite ^/about\.php$                           /about/                           permanent;
    rewrite ^/contact\.php$                         /contact/                         permanent;
    rewrite ^/testimonials\.php$                    /work/                            permanent;
    rewrite ^/services/index\.php$                  /services/                        permanent;
    rewrite ^/services/web_development\.php$        /services/website-development/   permanent;
    rewrite ^/services/mobile_app_development\.php$ /services/mobile-app-development/ permanent;
    rewrite ^/services/software_development\.php$   /services/custom-software-development/ permanent;
    rewrite ^/services/e-?commerce_development\.php$ /services/ecommerce-development/ permanent;
    rewrite ^/services/ui_ux_design\.php$           /services/ui-ux-design/           permanent;
    rewrite ^/services/.*blockchain.*\.php$         /services/blockchain-development/ permanent;
    rewrite ^/services/.*cyber.*\.php$              /services/cybersecurity/          permanent;
    rewrite ^/services/.*(machine|_ml).*\.php$      /services/ai-machine-learning/    permanent;
    rewrite ^/services/ai.*\.php$                   /services/ai-automation/          permanent;
    rewrite ^/services/.+\.php$                     /services/                        permanent;
    rewrite ^/promotions/                           /services/maintenance-support/    permanent;

    # Admin panel and APIs -> Node (PM2 app armedias, port 4321)
    location /admin {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/armedias-security-headers.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    # Fingerprinted build assets never change. ^~ stops the image/font regex below from
    # taking over hashed fonts and images, and one add_header avoids a second
    # Cache-Control line from `expires`.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/armedias-security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|webp|avif|svg|ico|woff2)$ {
        expires 30d;
        try_files $uri =404;
    }

    # Pages: /about -> /about/ (matches trailingSlash: 'always'), then the static file
    location / {
        rewrite ^([^.]*[^/])$ $1/ permanent;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/snippets/armedias-security-headers.conf;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
