# Temporary HTTP-only site, used once to get HTTPS certificates from Let's Encrypt.
# Replaced by deploy/nginx.conf afterwards.
server {
    listen 80;
    listen [::]:80;
    server_name armedias.com www.armedias.com;
    root /var/www/armedias/current/dist/client;
    location / { try_files $uri $uri/index.html =404; }
}
