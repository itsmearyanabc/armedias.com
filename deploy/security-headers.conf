# /etc/nginx/snippets/armedias-security-headers.conf
# Included at server level and again in every location that sets its own add_header,
# because nginx drops inherited add_header lines in such locations.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
